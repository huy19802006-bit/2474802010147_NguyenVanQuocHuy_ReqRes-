name: ReqRes API Testing

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman
        run: |
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            -d users.csv \
            --env-var "apiKey=${{ secrets.REQRES_API_KEY }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
          
